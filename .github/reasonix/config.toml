config_version = 12
default_model = "opencode/space-bunny-free"   # zen gate keys on the client identity: five of the six completions-capable free ids answer HTTP 403 to reasonix's profile (verified per model), space-bunny is open (verified: -p -> PONG)

[[providers]]
name = "opencode"
kind = "openai"
base_url = "https://opencode.ai/zen/v1"
models = ["space-bunny-free"]
default = "space-bunny-free"
api_key_env = "OPENCODE_API_KEY"
context_window = 1048576   # tokens; compaction triggers near this limit
model_overrides = { "space-bunny-free" = { reasoning_protocol = "openai", vision = true, context_window = 1048576, max_output_tokens = 524288 } }   # per-model context/output/vision, same limits as .github/dsh/generate-settings.py (models.dev). The list is the free + non-deprecated + openai-completions set that actually passes this host's gate: the two muse-spark ids need the responses API, the other five completions ids 403 reasonix's client profile (dsh passes them only because it is patched to the opencode identity), the deprecated and gateway-dead ids never surface (asserted in paseo.yml)
