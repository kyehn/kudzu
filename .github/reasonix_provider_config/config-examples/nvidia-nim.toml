# NVIDIA NIM 配置示例
# 需要 NVIDIA_API_KEY 环境变量
[[providers]]
name = "nvidia-nemotron-ultra"
kind = "openai"
base_url = "https://api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
model = "nvidia/nemotron-3-ultra-550b-a55b"
context_window = 128000
max_output = 32000
vision = false
supported_efforts = ["low", "medium", "high"]
default_effort = "high"

[provider."nvidia-nemotron-ultra".prices]
[provider."nvidia-nemotron-ultra".prices."nvidia/nemotron-3-ultra-550b-a55b"]
input = 2.5e-7
output = 2.5e-7
cache_hit = 2.5e-8
