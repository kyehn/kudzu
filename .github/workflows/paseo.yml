name: paseo
concurrency:
  group: ${{ github.workflow }}-${{ inputs.runner }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
      pair-link:
        description: 'Pairing link'
        required: false
        default: false
        type: boolean
jobs:
  paseo:
    timeout-minutes: 319
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@main
        with:
          path: ${{ github.event.repository.name }}
          fetch-depth: "0"
          token: ${{ secrets.GH_PAT }}
      - uses: ./kudzu/.github/actions/install-nix
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/nixpkgs
          fetch-depth: "2"
          path: nixpkgs
          token: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/torvox
          fetch-depth: "0"
          path: torvox
          token: ${{ secrets.GH_PAT }}
      - uses: cachix/cachix-action@master
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache/restore@main
        id: cache
        with:
          path: |
            ~/.paseo
            ~/.pi/agent/sessions
            ~/.local/share/opencode/opencode.db
            ~/.local/share/cortexkit/magic-context
            ~/.local/share/maki
            ~/.local/state/maki
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/*/transforms
            ~/.gradle/caches/jars-*
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-
      - run: rm -f "$HOME/.config/nix/nix.conf"
      - uses: ./kudzu/.github/actions/install-config
        with:
          working-directory: ${{ github.event.repository.name }}
      - working-directory: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.paseo" "$HOME/.pi/agent/skills" "$HOME/.pi/agent/extensions" "$HOME/.pi/agent/sessions" "$HOME/.config/mcp" "$HOME/.config/opencode" "$HOME/.config/cortexkit" "$HOME/.local/share/cortexkit/magic-context" "$HOME/.config/maki"
          nix profile add nixpkgs#ripgrep nixpkgs#skills nixpkgs#openspec nixpkgs#rtk nixpkgs#bun .#maki
          npm install --global --yes @getpaseo/cli@0.9.2

          install -m 0644 .github/paseo-config.json ~/.paseo/config.json
          npm install --global --yes @earendil-works/pi-coding-agent@0.87.1

          nix build --verbose --print-build-logs --print-out-paths --impure .#pi-agent-settings --out-link /tmp/pi-agent-settings && install -m 0644 /tmp/pi-agent-settings ~/.pi/agent/settings.json && rm -f /tmp/pi-agent-settings
          nix build --verbose --print-build-logs --print-out-paths --impure .#pi-agent-mcp --out-link /tmp/pi-agent-mcp && install -m 0644 /tmp/pi-agent-mcp ~/.config/mcp/mcp.json && rm -f /tmp/pi-agent-mcp
          cp -r .github/pi-opencode ~/.pi/agent/extensions/pi-opencode
          pushd ~/.pi/agent/extensions/pi-opencode && npm install --yes && npm run typecheck && npm test --yes && popd
          npm install --global --yes @oh-my-pi/pi-coding-agent@18.3.0
          pushd .github/pi-opencode && npm install --yes && npm run typecheck && npm test --yes && popd
          omp plugin install ./.github/pi-opencode
          npm install --global --yes deepseekharness-acp-interactive@1.3.2
          mkdir -p ~/.dsh
          python3 .github/dsh/generate-settings.py
          cat << 'EOF' > ~/.dsh/.credentials.yaml
          version: 1
          refs:
            OPENCODE_PUBLIC: public
            DEEPSEEK_API_KEY: unused-placeholder
          EOF
          chmod 600 ~/.dsh/.credentials.yaml
          ./.github/dsh/apply-headers-patch.sh
          npm install --global --yes reasonix@1.39.0
          mkdir -p ~/.reasonix
          install -m 0644 .github/reasonix/config.toml ~/.reasonix/config.toml
          printf 'OPENCODE_API_KEY=public\n' > ~/.reasonix/.env
          chmod 600 ~/.reasonix/.env

          install -m 0644 .github/AGENTS.md ~/.pi/agent/AGENTS.md
          install -m 0644 .github/magic-context.jsonc ~/.config/cortexkit/magic-context.jsonc
          npm install --global --yes @opencode/cli@2.0.16

          nix build --verbose --print-build-logs --print-out-paths --impure .#opencode-config --out-link /tmp/opencode-config && install -m 0644 /tmp/opencode-config ~/.config/opencode/opencode.json && rm -f /tmp/opencode-config
          install -m 0644 .github/AGENTS.md ~/.config/opencode/AGENTS.md
          curl -sL https://raw.githubusercontent.com/mksglu/context-mode/main/configs/opencode/AGENTS.md >> ~/.config/opencode/AGENTS.md
          npm install --global --yes open-websearch@2.1.11

          npm install --global --yes @mobilenext/mobile-mcp@1.0.5

          nix build --verbose --print-build-logs --print-out-paths --impure .#maki-config --out-link /tmp/maki-config && install -m 0644 /tmp/maki-config/init.lua ~/.config/maki/init.lua && install -m 0644 /tmp/maki-config/permissions.toml ~/.config/maki/permissions.toml && install -m 0644 /tmp/maki-config/mcp.toml ~/.config/maki/mcp.toml && rm -rf /tmp/maki-config
          install -m 0644 .github/AGENTS.md ~/.config/maki/AGENTS.md
          ln -sf ~/.pi/agent/skills ~/.config/maki/skills
      - run: |
          cat << 'EOF' > ~/.pi/agent/auth.json
          {
            "opencode": {
              "type": "api_key",
              "key": "public"
            },
            "nvidia": {
              "type": "api_key",
              "key": "${{ secrets.NVIDIA_API_KEY }}"
            }
          }
          EOF
      - run: overlays/maki/providers-config.py
        working-directory: ${{ github.event.repository.name }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - run: echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
      - id: onboard
        working-directory: ${{ github.event.repository.name }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"
          OPENCODE_DISABLE_AUTOUPDATE: true
          OPENCODE_DISABLE_DEFAULT_PLUGINS: true
          OPENCODE_EXPERIMENTAL_PARALLEL: true
          OPENCODE_ENABLE_EXPERIMENTAL_MODELS: true
          OPENCODE_DISABLE_CLAUDE_CODE: 1
          OPENCODE_DISABLE_CLAUDE_CODE_PROMPT: 1
          OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: 1
          OPENCODE_ENABLE_EXA: false
          OPENCODE_AUTO_SHARE: false
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: true
          OPENCODE_EXPERIMENTAL_PLAN_MODE: true
          OPENCODE_EXPERIMENTAL_NATIVE_LLM: true
          OPENCODE_EXPERIMENTAL_DISABLE_COPY_ON_SELECT: true
          OPENCODE_EXPERIMENTAL_LSP_TOOL: false
          OPENCODE_EXPERIMENTAL_OXFMT: false
          OPENCODE_EXPERIMENTAL_LSP_TY: false
          OPENCODE_EXPERIMENTAL_SCOUT: true
        run: |
          set -euo pipefail
          skills add mattpocock/skills --agent opencode --global --yes
          skills add addyosmani/agent-skills --agent opencode --global --yes
          skills add Fission-AI/OpenSpec --agent opencode --global --yes
          skills add blader/humanizer --agent opencode --global --yes
          git clone --depth 1 --single-branch https://github.com/aldefy/compose-skill.git /tmp/compose-skill && cp -r /tmp/compose-skill/skills/compose-expert $HOME/.config/opencode/skills/ && rm -rf /tmp/compose-skill
          skills add https://github.com/Aas-ee/open-webSearch --skill open-websearch --agent opencode --global --yes
          skills add getpaseo/paseo --agent opencode --global --yes
          skills add levi-qiao/longgraph-skill --full-depth --skill '*' --agent opencode --global --yes
          skills add mattpocock/skills --agent pi --global --yes
          skills add addyosmani/agent-skills --agent pi --global --yes
          skills add Fission-AI/OpenSpec --agent pi --global --yes
          skills add blader/humanizer --agent pi --global --yes
          git clone --depth 1 --single-branch https://github.com/aldefy/compose-skill.git /tmp/compose-skill && cp -r /tmp/compose-skill/skills/compose-expert $HOME/.pi/agent/skills/ && rm -rf /tmp/compose-skill
          skills add https://github.com/Aas-ee/open-webSearch --skill open-websearch --agent pi --global --yes
          skills add getpaseo/paseo --agent pi --global --yes
          skills add levi-qiao/longgraph-skill --full-depth --skill '*' --agent pi --global --yes
          export PATH="${ANDROID_HOME:+$ANDROID_HOME/platform-tools:}$PATH"
          pi --help
          if [[ '${{ inputs.pair-link }}' == 'true' ]]; then
            paseo onboard --relay --voice disable
          else
            paseo onboard --relay --voice disable > /dev/null
          fi
      - working-directory: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # 本地四宿主：捕获完整输出后再 grep（直接接管道会因 SIGPIPE 丢尾部输出）
          for spec in \
            "pi -p --model opencode/mimo-v2.6-flash-free" \
            "omp -p --model opencode/mimo-v2.6-flash-free" \
            "opencode run --model opencode/mimo-v2.6-flash-free" \
            "reasonix -p"; do
            out=$($spec "Reply with exactly: PONG")
            printf '%s\n' "$out" | grep -qx PONG
          done
          echo "conversation ok: local pi/omp/opencode/reasonix"
          for spec in \
            "omp opencode/mimo-v2.6-flash-free" \
            "dsh zen:mimo-v2.6-flash-free" \
            "opencode2 opencode/mimo-v2.6-flash-free" \
            "maki opencode-openai/mimo-v2.6-flash-free"; do
            provider=${spec%% *}
            model=${spec#* }
            id=$(paseo run -q --provider "$provider" --model "$model" --wait-timeout 5m "Reply with exactly: PONG" 2>&1 | tail -1)
            transcript=$(paseo logs "$id" --tail 50 | sed 's/^\[[^]]*\] //')
            printf '%s\n' "$transcript" | grep -qx PONG
            echo "conversation ok: $provider ($model)"
          done
          # 动态模型列表：新免费模型（space-bunny）必须在；上游已弃用/已死的模型
          # （mimo v2.5、deepseek v4 flash、jev 1.13，字面 id 只存在于下面的正则里）
          # 任何宿主都不得出现。断言必须写成 if…then exit1 —— `! cmd` 在 set -e 下
          # 返回 1 不会中止脚本，断言会静默失效。
          retired_re='mimo-v2\.5-free|deepseek-v4-flash-free|jev-1\.13-free'
          assert_model_list() {
            if ! grep -q "space-bunny-free" <<<"$2"; then
              echo "model list missing space-bunny-free: $1"
              printf '%s\n' "$2" | tail -40
              exit 1
            fi
            if grep -Eq "$retired_re" <<<"$2"; then
              echo "model list carries a retired id: $1"
              printf '%s\n' "$2" | grep -E "$retired_re"
              exit 1
            fi
            echo "model list ok: $1"
          }
          assert_model_list "pi" "$(pi --list-models)"
          assert_model_list "omp" "$(omp models)"
          assert_model_list "dsh settings" "$(cat "$HOME/.dsh/settings.yaml")"
          assert_model_list "reasonix config" "$(cat "$HOME/.reasonix/config.toml")"
          for provider in dsh omp maki opencode2; do
            assert_model_list "$provider" "$(paseo provider models "$provider")"
          done
      - run: tail -f "$HOME/.paseo/daemon.log"
      - if: ${{ always() && steps.onboard.outcome == 'success' }}
        run: |
          paseo daemon stop
          rm -rf ~/.paseo/paseo.pid ~/.paseo/daemon.log
      - if: ${{ always() && steps.onboard.outcome == 'success' }}
        uses: actions/cache/save@main
        with:
          path: |
            ~/.paseo
            ~/.pi/agent/sessions
            ~/.local/share/opencode/opencode.db
            ~/.local/share/cortexkit/magic-context
            ~/.local/share/maki
            ~/.local/state/maki
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/*/transforms
            ~/.gradle/caches/jars-*
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
