name: paseo
concurrency:
  group: ${{ github.workflow }}-${{ inputs.runner }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
      pair-link:
        description: 'Pairing link'
        required: false
        default: false
        type: boolean
jobs:
  paseo:
    timeout-minutes: 317
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@main
        with:
          path: ${{ github.event.repository.name }}
          fetch-depth: "0"
          token: ${{ secrets.GH_PAT }}
      - uses: ./kudzu/.github/actions/install-nix
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/nixpkgs
          fetch-depth: "2"
          path: nixpkgs
          token: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/torvox
          fetch-depth: "0"
          path: torvox
          token: ${{ secrets.GH_PAT }}
      - uses: cachix/cachix-action@master
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache/restore@main
        id: cache
        with:
          path: |
            ~/.paseo
            ~/.pi/agent/sessions
            ~/.local/share/cortexkit/magic-context
            ~/.local/share/maki
            ~/.local/state/maki
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/*/transforms
            ~/.gradle/caches/jars-*
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-
      - run: rm -f "$HOME/.config/nix/nix.conf"
      - uses: ./kudzu/.github/actions/install-config
        with:
          working-directory: ${{ github.event.repository.name }}
      - working-directory: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.paseo" "$HOME/.pi/agent/skills" "$HOME/.pi/agent/extensions" "$HOME/.pi/agent/sessions" "$HOME/.config/mcp" "$HOME/.config/cortexkit" "$HOME/.local/share/cortexkit/magic-context" "$HOME/.config/maki"
          nix profile add nixpkgs#openspec nixpkgs#rust-analyzer nixpkgs#ktlint nixpkgs#ruff nixpkgs#bun nixpkgs#skills nixpkgs#rtk .#maki
          npm install --global --yes @getpaseo/cli
          install -m 0644 .github/paseo-config.json ~/.paseo/config.json
          bun add -g --ignore-scripts @earendil-works/pi-coding-agent
          nix build --verbose --print-build-logs --print-out-paths --impure .#pi-agent-settings --out-link /tmp/pi-agent-settings && install -m 0644 /tmp/pi-agent-settings ~/.pi/agent/settings.json && rm -f /tmp/pi-agent-settings
          nix build --verbose --print-build-logs --print-out-paths --impure .#pi-agent-mcp --out-link /tmp/pi-agent-mcp && install -m 0644 /tmp/pi-agent-mcp ~/.config/mcp/mcp.json && rm -f /tmp/pi-agent-mcp
          cp -r .github/pi-opencode ~/.pi/agent/extensions/pi-opencode
          pushd ~/.pi/agent/extensions/pi-opencode && npm install --yes && popd
          install -m 0644 .github/AGENTS.md ~/.pi/agent/AGENTS.md
          cp .github/magic-context.jsonc ~/.config/cortexkit/magic-context.jsonc
          npm install --global --yes open-websearch
          npm install -g @tobilu/qmd
          nix build --verbose --print-build-logs --print-out-paths --impure .#maki-config --out-link /tmp/maki-config && install -m 0644 /tmp/maki-config/init.lua ~/.config/maki/init.lua && install -m 0644 /tmp/maki-config/permissions.toml ~/.config/maki/permissions.toml && install -m 0644 /tmp/maki-config/mcp.toml ~/.config/maki/mcp.toml && rm -rf /tmp/maki-config
          install -m 0644 .github/AGENTS.md ~/.config/maki/AGENTS.md
          ln -sf ~/.pi/agent/skills ~/.config/maki/skills
      - run: |
          cat << 'EOF' > ~/.pi/agent/auth.json
          {
            "opencode": {
              "type": "api_key",
              "key": "public"
            },
            "nvidia": {
              "type": "api_key",
              "key": "${{ secrets.NVIDIA_API_KEY }}"
            }
          }
          EOF
      - run: overlays/maki/providers-config.py
        working-directory: ${{ github.event.repository.name }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - run: echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
      - id: onboard
        working-directory: ${{ github.event.repository.name }}
        env:
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"
        run: |
          set -euo pipefail
          skills add mattpocock/skills --agent pi --global --yes
          skills add addyosmani/agent-skills --agent pi --global --yes
          skills add Fission-AI/OpenSpec --agent pi --global --yes
          skills add blader/humanizer --agent pi --global --yes
          git clone --depth 1 --single-branch https://github.com/aldefy/compose-skill.git /tmp/compose-skill && cp -r /tmp/compose-skill/skills/compose-expert $HOME/.pi/agent/skills/ && rm -rf /tmp/compose-skill
          skills add https://github.com/Aas-ee/open-webSearch --skill open-websearch --agent pi --global --yes
          skills add getpaseo/paseo --agent pi --global --yes
          skills add levi-qiao/longgraph-skill --full-depth --skill '*' --agent pi --global --yes
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:${ANDROID_HOME:+$ANDROID_HOME/platform-tools:}$PATH"
          pi --help
          if [[ '${{ inputs.pair-link }}' == 'true' ]]; then
            paseo onboard --relay --voice disable
          else
            paseo onboard --relay --voice disable > /dev/null
          fi
      - run: tail -f "$HOME/.paseo/daemon.log"
      - if: ${{ always() && steps.onboard.outcome == 'success' }}
        run: |
          paseo daemon stop
          rm -rf ~/.paseo/paseo.pid ~/.paseo/daemon.log
      - if: ${{ always() && steps.onboard.outcome == 'success' }}
        uses: actions/cache/save@main
        with:
          path: |
            ~/.paseo
            ~/.pi/agent/sessions
            ~/.local/share/cortexkit/magic-context
            ~/.local/share/maki
            ~/.local/state/maki
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/*/transforms
            ~/.gradle/caches/jars-*
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
