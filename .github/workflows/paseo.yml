name: paseo
concurrency:
  group: ${{ github.workflow }}-${{ inputs.runner }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
      pair-link:
        description: 'Pairing link'
        required: false
        default: false
        type: boolean
jobs:
  paseo:
    timeout-minutes: 319
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@main
        with:
          path: ${{ github.event.repository.name }}
          fetch-depth: "0"
          token: ${{ secrets.GH_PAT }}
      - uses: ./kudzu/.github/actions/install-nix
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/nixpkgs
          fetch-depth: "2"
          path: nixpkgs
          token: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/torvox
          fetch-depth: "0"
          path: torvox
          token: ${{ secrets.GH_PAT }}
      - uses: cachix/cachix-action@master
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache/restore@main
        id: cache
        with:
          path: |
            ~/.paseo
            ~/.reasonix/sessions-v4
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/*/transforms
            ~/.gradle/caches/jars-*
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-
      - run: rm -f "$HOME/.config/nix/nix.conf"
      - uses: ./kudzu/.github/actions/install-config
        with:
          working-directory: ${{ github.event.repository.name }}
      - working-directory: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.paseo" "$HOME/.reasonix"
          nix profile add nixpkgs#openspec nixpkgs#skills .#reasonix
          npm install --global --yes @getpaseo/cli
          install -m 0644 .github/paseo-config.json ~/.paseo/config.json
          nix build --verbose --print-build-logs --print-out-paths --impure .#reasonix-config --out-link /tmp/reasonix-config && install -m 0644 /tmp/reasonix-config ~/.reasonix/config.toml && rm -f /tmp/reasonix-config
          install -m 0644 .github/AGENTS.md ~/.reasonix/AGENTS.md
          npm install --global --yes open-websearch
      - run: |
          echo "NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}" > ~/.reasonix/.env
          echo "OPENCODE_API_KEY=public" >> ~/.reasonix/.env
      - run: overlays/reasonix/providers-config.py
        working-directory: ${{ github.event.repository.name }}
      - run: echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
      - id: onboard
        working-directory: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          skills add mattpocock/skills --agent reasonix --global --yes
          skills add addyosmani/agent-skills --agent reasonix --global --yes
          skills add Fission-AI/OpenSpec --agent reasonix --global --yes
          skills add blader/humanizer --agent reasonix --global --yes
          git clone --depth 1 --single-branch https://github.com/aldefy/compose-skill.git /tmp/compose-skill && cp -r /tmp/compose-skill/skills/compose-expert $HOME/.pi/agent/skills/ && rm -rf /tmp/compose-skill
          skills add https://github.com/Aas-ee/open-webSearch --skill open-websearch --agent reasonix --global --yes
          skills add getpaseo/paseo --agent reasonix --global --yes
          skills add levi-qiao/longgraph-skill --full-depth --skill '*' --agent reasonix --global --yes
          export PATH="${ANDROID_HOME:+$ANDROID_HOME/platform-tools:}$PATH"
          if [[ '${{ inputs.pair-link }}' == 'true' ]]; then
            paseo onboard --relay --voice disable
          else
            paseo onboard --relay --voice disable > /dev/null
          fi
      - run: tail -f "$HOME/.paseo/daemon.log"
      - if: ${{ always() && steps.onboard.outcome == 'success' }}
        run: |
          paseo daemon stop
          rm -rf ~/.paseo/paseo.pid ~/.paseo/daemon.log
      - if: ${{ always() && steps.onboard.outcome == 'success' }}
        uses: actions/cache/save@main
        with:
          path: |
            ~/.paseo
            ~/.reasonix/sessions-v4
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/*/transforms
            ~/.gradle/caches/jars-*
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
