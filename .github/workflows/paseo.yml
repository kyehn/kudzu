name: paseo
concurrency:
  group: ${{ github.workflow }}-${{ inputs.runner }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26
jobs:
  paseo:
    timeout-minutes: 329
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: "0"
          token: ${{ secrets.GH_PAT }}
      - uses: ./.github/actions/install-nix
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/nixpkgs
          fetch-depth: "2"
          path: repositories/nixpkgs
          token: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/torvox
          fetch-depth: "0"
          path: repositories/torvox
          token: ${{ secrets.GH_PAT }}
      - uses: cachix/cachix-action@master
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache/restore@main
        id: cache
        with:
          path: |
            ~/.paseo
            ~/.reasonix
          key: ${{ github.workflow }}-state-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ${{ github.workflow }}-state-${{ runner.os }}-${{ runner.arch }}-
      - run: |
          set -euo pipefail
          rm -f "$HOME/.config/nix/nix.conf"
          mkdir -p "$HOME/.paseo" "$HOME/.reasonix/skills" "$HOME/.reasonix/commands"
          nix profile add .#openspec .#reasonix
          nix build --verbose --print-build-logs --print-out-paths --impure .#reasonix-config --out-link /tmp/reasonix-config && install -m 0644 /tmp/reasonix-config ~/.reasonix/config.toml && rm -f /tmp/reasonix-config
          npm install --global --yes @getpaseo/cli
          install -m 0644 .github/paseo-config.json ~/.paseo/config.json
          install -m 0644 .github/AGENTS.md ~/.reasonix/AGENTS.md
          npm install --global --yes open-websearch
      - run: |
          echo "NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}" > ~/.reasonix/.env
          echo "OPENCODE_API_KEY=public" >> ~/.reasonix/.env
      - run: echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
      - run: |
          set -euo pipefail
          npx skills@latest add mattpocock/skills --agent reasonix  --global --yes
          npx skills@latest add addyosmani/agent-skills --agent reasonix --global --yes
          npx skills@latest add Fission-AI/OpenSpec --agent reasonix --global --yes
          npx skills@latest add blader/humanizer --agent reasonix --global --yes
          git clone --depth 1 --single-branch https://github.com/aldefy/compose-skill.git /tmp/compose-skill && cp -r /tmp/compose-skill/skills/compose-expert ~/.reasonix/skills/ && rm -rf /tmp/compose-skill
          npx skills@latest add https://github.com/Aas-ee/open-webSearch --skill open-websearch --agent reasonix --global --yes
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          pushd .github/reasonix-config
          pip install -e .
          reasonix-config
          popd
          paseo onboard --voice disable
          # timeout 15s python3 -c 'import os,pty,subprocess,time; m,s=pty.openpty(); p=subprocess.Popen(["paseo","onboard","--voice","disable"], stdin=s, stdout=s, stderr=s, start_new_session=True); os.close(s); time.sleep(2); os.close(m)' >/dev/null 2>&1 </dev/null
          tail -f "$HOME/.paseo/daemon.log"
      - if: always()
        run: |
          paseo daemon stop
          rm -rf ~/.reasonix/logs ~/.reasonix/config.toml* ~/.reasonix/.env ~/.reasonix/skills ~/.reasonix/commands ~/.paseo/paseo.pid ~/.paseo/daemon.log
      - if: always()
        uses: actions/cache/save@main
        with:
          path: |
            ~/.paseo
            ~/.reasonix
          key: ${{ github.workflow }}-state-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
