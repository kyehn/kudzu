name: paseo
concurrency:
  group: ${{ github.workflow }}-${{ inputs.runner }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
      pair-link:
        description: 'Pairing link'
        required: false
        default: false
        type: boolean
jobs:
  paseo:
    timeout-minutes: 321
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@main
        with:
          path: ${{ github.event.repository.name }}
          fetch-depth: "0"
          token: ${{ secrets.GH_PAT }}
      - uses: ./kudzu/.github/actions/install-nix
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/nixpkgs
          fetch-depth: "2"
          path: nixpkgs
          token: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/torvox
          fetch-depth: "0"
          path: torvox
          token: ${{ secrets.GH_PAT }}
      - uses: cachix/cachix-action@master
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache/restore@main
        id: cache
        with:
          path: |
            ~/.paseo
            ~/.local/share/maki
            ~/.local/state/maki
            ~/.dsh/acp-sessions
            ~/.local/share/opencode/opencode.db
            ~/.local/share/cortexkit/magic-context
            ~/.reasonix/sessions-v4
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-
      - run: rm -f "$HOME/.config/nix/nix.conf"
      - uses: ./kudzu/.github/actions/install-config
        with:
          working-directory: ${{ github.event.repository.name }}
      - working-directory: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.paseo" "$HOME/.config/maki" "$HOME/.dsh" "$HOME/.config/opencode" "$HOME/.config/cortexkit" "$HOME/.reasonix"
          nix profile add nixpkgs#fd nixpkgs#ripgrep nixpkgs#skills nixpkgs#openspec nixpkgs#rtk .#maki .#reasonix
          npm install --global --yes @getpaseo/cli
          install -m 0644 .github/paseo-config.json ~/.paseo/config.json
          nix build --verbose --print-build-logs --print-out-paths --impure .#maki-config --out-link /tmp/maki-config && install -m 0644 /tmp/maki-config/init.lua ~/.config/maki/init.lua && install -m 0644 /tmp/maki-config/permissions.toml ~/.config/maki/permissions.toml && install -m 0644 /tmp/maki-config/mcp.toml ~/.config/maki/mcp.toml && rm -rf /tmp/maki-config
          install -m 0644 .github/AGENTS.md ~/.config/maki/AGENTS.md
          npm install --global --yes deepseekharness-acp-interactive@1.4.1
          dsh_llm_pi_ai="$(npm root -g)/deepseekharness-acp-interactive/node_modules/@deepseek-ai/dsh-llm-pi-ai" && patch --dry-run -p1 -d "$dsh_llm_pi_ai" < overlays/dsh/opencode-headers.patch && patch -p1 -d "$dsh_llm_pi_ai" < overlays/dsh/opencode-headers.patch
          nix build --verbose --print-build-logs --print-out-paths --impure .#dsh-config --out-link /tmp/dsh-config && install -m 0644 /tmp/dsh-config/cordis.patch.yml ~/.dsh/cordis.patch.yml && rm -rf /tmp/dsh-config
          overlays/dsh/providers-config.py
          npm install --global --yes @opencode/cli
          nix build --verbose --print-build-logs --print-out-paths --impure .#opencode-config --out-link /tmp/opencode-config && install -m 0644 /tmp/opencode-config ~/.config/opencode/opencode.json && rm -f /tmp/opencode-config
          install -m 0644 .github/AGENTS.md ~/.config/opencode/AGENTS.md
          cp .github/magic-context.jsonc ~/.config/cortexkit/magic-context.jsonc
          npm install --global --yes @mobilenext/mobile-mcp
          nix build --verbose --print-build-logs --print-out-paths --impure .#reasonix-config --out-link /tmp/reasonix-config && install -m 0644 /tmp/reasonix-config ~/.reasonix/config.toml && rm -f /tmp/reasonix-config
          install -m 0644 .github/AGENTS.md ~/.reasonix/AGENTS.md
      - run: |
          overlays/maki/providers-config.py
          install -m 0600 /dev/null ~/.dsh/.credentials.yaml && yq -i '.version = 1 | .refs.OPENCODE_API_KEY = "public" | .refs.DEEPSEEK_API_KEY = "none" | .refs.NVIDIA_API_KEY = strenv(NVIDIA_API_KEY)' ~/.dsh/.credentials.yaml
        working-directory: ${{ github.event.repository.name }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - run: overlays/reasonix/providers-config.py
        working-directory: ${{ github.event.repository.name }}
      - run: |
          echo "NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}" > ~/.reasonix/.env
          echo "OPENCODE_API_KEY=public" >> ~/.reasonix/.env
      - run: echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
      - id: onboard
        working-directory: ${{ github.event.repository.name }}
        env:
          DSH_TELEMETRY_DISABLED: 1
          OPENCODE_DISABLE_AUTOUPDATE: true
          OPENCODE_DISABLE_DEFAULT_PLUGINS: true
          OPENCODE_EXPERIMENTAL_PARALLEL: true
          OPENCODE_ENABLE_EXPERIMENTAL_MODELS: true
          OPENCODE_DISABLE_CLAUDE_CODE: 1
          OPENCODE_DISABLE_CLAUDE_CODE_PROMPT: 1
          OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: 1
          OPENCODE_ENABLE_EXA: false
          OPENCODE_AUTO_SHARE: false
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: true
          OPENCODE_EXPERIMENTAL_PLAN_MODE: true
          OPENCODE_EXPERIMENTAL_NATIVE_LLM: true
          OPENCODE_EXPERIMENTAL_DISABLE_COPY_ON_SELECT: true
          OPENCODE_EXPERIMENTAL_LSP_TOOL: false
          OPENCODE_EXPERIMENTAL_OXFMT: false
          OPENCODE_EXPERIMENTAL_LSP_TY: false
          OPENCODE_EXPERIMENTAL_SCOUT: true
        run: |
          set -euo pipefail
          skills add mattpocock/skills --agent zed --global --yes
          skills add addyosmani/agent-skills --agent zed --global --yes
          skills add Fission-AI/OpenSpec --agent zed --global --yes
          skills add blader/humanizer --agent zed --global --yes
          skills add aldefy/compose-skill --full-depth --skill '*' --agent zed --global --yes
          skills add https://github.com/Aas-ee/open-webSearch --skill open-websearch --agent zed --global --yes
          skills add getpaseo/paseo --agent zed --global --yes
          export PATH="${ANDROID_HOME:+$ANDROID_HOME/platform-tools:}$PATH"
          if [[ '${{ inputs.pair-link }}' == 'true' ]]; then
            paseo onboard --relay --voice disable
          else
            paseo onboard --relay --voice disable > /dev/null
          fi
      - run: tail -f "$HOME/.paseo/daemon.log"
      - if: ${{ always() && steps.onboard.outcome == 'success' }}
        run: |
          paseo daemon stop
          rm -rf ~/.paseo/paseo.pid ~/.paseo/daemon.log
      - if: ${{ always() && steps.onboard.outcome == 'success' }}
        uses: actions/cache/save@main
        with:
          path: |
            ~/.paseo
            ~/.local/share/maki
            ~/.local/state/maki
            ~/.dsh/acp-sessions
            ~/.local/share/opencode/opencode.db
            ~/.local/share/cortexkit/magic-context
            ~/.reasonix/sessions-v4
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
