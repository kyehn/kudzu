name: paseo
concurrency:
  group: ${{ github.workflow }}-${{ inputs.runner }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
      pair-link:
        description: 'Pairing link'
        required: false
        default: false
        type: boolean
jobs:
  paseo:
    timeout-minutes: 323
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@main
        with:
          path: ${{ github.event.repository.name }}
          fetch-depth: "0"
          token: ${{ secrets.GH_PAT }}
      - uses: ./kudzu/.github/actions/install-nix
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/nixpkgs
          fetch-depth: "2"
          path: nixpkgs
          token: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/torvox
          fetch-depth: "0"
          path: torvox
          token: ${{ secrets.GH_PAT }}
      - uses: cachix/cachix-action@master
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache/restore@main
        id: cache
        with:
          path: |
            ~/.paseo
            ~/.pi/agent/sessions
            ~/.local/state/maki
            ~/.dsh/sessions
            ~/.local/share/opencode/opencode.db
            ~/.local/share/cortexkit/magic-context
            ~/.reasonix/sessions
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/*/kotlin-dsl
            ~/.gradle/caches/*/javaCompile
            ~/.gradle/caches/*/transforms
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-
      - run: rm -f "$HOME/.config/nix/nix.conf"
      - uses: ./kudzu/.github/actions/install-config
        with:
          working-directory: ${{ github.event.repository.name }}
      - working-directory: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.paseo" "$HOME/.config/maki" "$HOME/.dsh" "$HOME/.config/opencode" "$HOME/.dsh" "$HOME/.config/cortexkit" "$HOME/.reasonix" "$HOME/.pi/agent/extensions"
          nix profile add nixpkgs#fd nixpkgs#ripgrep nixpkgs#skills nixpkgs#openspec nixpkgs#rtk .#maki .#reasonix nixpkgs#bun nixpkgs#pnpm nixpkgs#killport .#warp-go --impure
          npm install --global --yes @getpaseo/cli
          install -m 0644 .github/paseo-config.json ~/.paseo/config.json
          nix build --print-build-logs --print-out-paths --impure .#maki-config --out-link /tmp/maki-config && install -m 0644 /tmp/maki-config/init.lua ~/.config/maki/init.lua && install -m 0644 /tmp/maki-config/permissions.toml ~/.config/maki/permissions.toml && install -m 0644 /tmp/maki-config/mcp.toml ~/.config/maki/mcp.toml && rm -rf /tmp/maki-config
          install -m 0644 .github/AGENTS.md ~/.config/maki/AGENTS.md
          npm install --global --yes @deepseek-ai/dsh@latest
          nix build --print-build-logs --print-out-paths --impure .#dsh-cordis-patch --out-link /tmp/dsh-cordis-patch && install -m 0644 /tmp/dsh-cordis-patch ~/.dsh/cordis.patch.yml && rm -rf /tmp/dsh-cordis-patch
          npm install --global --yes @opencode/cli
          nix build --verbose --print-build-logs --print-out-paths --impure .#opencode-config --out-link /tmp/opencode-config && install -m 0644 /tmp/opencode-config ~/.config/opencode/opencode.json && rm -f /tmp/opencode-config
          install -m 0644 .github/AGENTS.md ~/.config/opencode/AGENTS.md
          cp .github/magic-context.jsonc ~/.config/cortexkit/magic-context.jsonc
          npm install --global --yes @mobilenext/mobile-mcp
          opencode models || true
          nix build --print-build-logs --print-out-paths --impure .#reasonix-config --out-link /tmp/reasonix-config && install -m 0644 /tmp/reasonix-config ~/.reasonix/config.toml && rm -f /tmp/reasonix-config
          install -m 0644 .github/AGENTS.md ~/.reasonix/AGENTS.md
          bun add -g --ignore-scripts @earendil-works/pi-coding-agent
          nix build --print-build-logs --print-out-paths --impure .#pi-agent-settings --out-link /tmp/pi-agent-settings && install -m 0644 /tmp/pi-agent-settings ~/.pi/agent/settings.json && rm -f /tmp/pi-agent-settings
          nix build --print-build-logs --print-out-paths --impure .#pi-agent-mcp --out-link /tmp/pi-agent-mcp && install -m 0644 /tmp/pi-agent-mcp ~/.pi/agent/mcp.json && rm -f /tmp/pi-agent-mcp
          install -m 0644 .github/AGENTS.md ~/.pi/agent/AGENTS.md
          npm install --global --yes @tobilu/qmd
      - run: |
          echo "NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}" > ~/.reasonix/.env
          cat << 'EOF' > ~/.pi/agent/auth.json
          {
            "nvidia": {
              "type": "api_key",
              "key": "${{ secrets.NVIDIA_API_KEY }}"
            }
          }
          EOF
          overlays/providers-config.py
          install -m 0600 /dev/null ~/.dsh/.credentials.yaml && yq -i '.version = 1 | .refs.DEEPSEEK_API_KEY = "none" | .refs.NVIDIA_API_KEY = strenv(NVIDIA_API_KEY)' ~/.dsh/.credentials.yaml
        working-directory: ${{ github.event.repository.name }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - run: echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
      - id: onboard
        working-directory: ${{ github.event.repository.name }}
        env:
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"
          DSH_TELEMETRY_DISABLED: 1
          OPENCODE_DISABLE_AUTOUPDATE: true
          OPENCODE_DISABLE_DEFAULT_PLUGINS: true
          OPENCODE_EXPERIMENTAL_PARALLEL: true
          OPENCODE_ENABLE_EXPERIMENTAL_MODELS: true
          OPENCODE_DISABLE_CLAUDE_CODE: 1
          OPENCODE_DISABLE_CLAUDE_CODE_PROMPT: 1
          OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: 1
          OPENCODE_ENABLE_EXA: false
          OPENCODE_AUTO_SHARE: false
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: true
          OPENCODE_EXPERIMENTAL_PLAN_MODE: true
          OPENCODE_EXPERIMENTAL_NATIVE_LLM: true
          OPENCODE_EXPERIMENTAL_DISABLE_COPY_ON_SELECT: true
          OPENCODE_EXPERIMENTAL_LSP_TOOL: false
          OPENCODE_EXPERIMENTAL_OXFMT: false
          OPENCODE_EXPERIMENTAL_LSP_TY: false
          OPENCODE_EXPERIMENTAL_SCOUT: true
        run: |
          set -euo pipefail
          skills add mattpocock/skills --agent zed --global --yes
          skills add addyosmani/agent-skills --agent zed --global --yes
          skills add Fission-AI/OpenSpec --agent zed --global --yes
          skills add blader/humanizer --agent zed --global --yes
          skills add aldefy/compose-skill --full-depth --skill '*' --agent zed --global --yes
          skills add maxrave-dev/kotlin-footguns --agent zed --global --yes
          skills add drjacky/claude-android-ninja --agent zed --global --yes
          skills add https://github.com/Aas-ee/open-webSearch --skill open-websearch --agent zed --global --yes
          skills add getpaseo/paseo --agent zed --global --yes
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:${ANDROID_HOME:+$ANDROID_HOME/platform-tools:}$PATH"
          pi --help
          pi update --models
          mkdir -p ~/.pi/agent/extensions/pi-rtk-optimizer ~/.pi/agent/extensions/pi-permission-system
          install -m 0644 overlays/pi-rtk-optimizer-config.json ~/.pi/agent/extensions/pi-rtk-optimizer/config.json
          install -m 0644 overlays/pi-permission-system-config.json ~/.pi/agent/extensions/pi-permission-system/config.json
          # pushd $HOME && killport --no-fail 40000 && warp -del && opencode service stop && rm -rf ~/.local/share/opencode ~/.local/state/opencode ~/.cache/opencode ~/.config/opencode/service.json && warp -reg && opencode service restart && warp && popd
          pushd $HOME
          warp -reg
          nohup warp > warp.log 2>&1 &
          opencode service set env HTTP_PROXY "http://127.0.0.1:4000"
          opencode service set env HTTPS_PROXY "http://127.0.0.1:4000"
          opencode service set env NO_PROXY localhost,127.0.0.1,::1
          opencode service set env OPENCODE_API_KEY public
          opencode service restart
          popd
          rm -rf ~/.dsh/profiles/web/
          dsh --profile paseo --from-default-profile web --dump-config > /dev/null
          dsh plugin --profile paseo add dsh-permission-rules
          dsh plugin --profile paseo add @wenaixi/dsh-ponytail
          if [[ '${{ inputs.pair-link }}' == 'true' ]]; then
            paseo onboard --relay --voice disable
          else
            paseo onboard --relay --voice disable > /dev/null
          fi
          paseo plugin install npm:paseo-dsh-direct
      - run: tail -f "$HOME/.paseo/daemon.log"
      - if: ${{ always() && steps.onboard.outcome == 'success' }}
        run: |
          comm -13 <(paseo ls -g --json | jq -r '.[].id' | sort) <(paseo ls -ag --json | jq -r '.[].id' | sort) | xargs -r -n1 paseo delete
          paseo daemon stop
          rm -rf ~/.paseo/paseo.pid ~/.paseo/daemon.log ~/.paseo/config.json ~/.paseo/worktrees ~/.local/state/maki/sessions/locks
      - if: ${{ always() && steps.onboard.outcome == 'success' }}
        uses: actions/cache/save@main
        with:
          path: |
            ~/.paseo
            ~/.pi/agent/sessions
            ~/.local/state/maki
            ~/.dsh/sessions
            ~/.local/share/opencode/opencode.db
            ~/.local/share/cortexkit/magic-context
            ~/.reasonix/sessions
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.gradle/caches/*/kotlin-dsl
            ~/.gradle/caches/*/javaCompile
            ~/.gradle/caches/*/transforms
            ~/.gradle/wrapper/dists
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
