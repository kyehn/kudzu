name: paseo
concurrency:
  group: paseo-${{ github.actor }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
jobs:
  paseo:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: "0"
      - uses: ./.github/actions/install-nix
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/nixpkgs
          fetch-depth: "5"
          path: repositories/nixpkgs
          token: ${{ secrets.TOKEN }}
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/torvox
          fetch-depth: "0"
          path: repositories/torvox
          token: ${{ secrets.TOKEN }}
      - uses: cachix/cachix-action@master
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache/restore@main
        id: cache
        with:
          path: |
            ~/.paseo
            ~/.reasonix/sessions
          key: paseo-state-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            paseo-state-${{ runner.os }}-${{ runner.arch }}-
      - run: |
          rm --force "$HOME/.config/nix/nix.conf"
          mkdir --parents "$HOME/.paseo" "$HOME/.reasonix/skills" "$HOME/.reasonix/sessions"
          npm install --global --yes reasonix
          cp .github/paseo-config.json ~/.paseo/config.json
          nix build --verbose --print-build-logs --print-out-paths --impure .#reasonix-config --out-link /tmp/reasonix-config && install -D --mode 0644 /tmp/reasonix-config ~/.reasonix/config.toml && rm --force /tmp/reasonix-config
          npm install --global --yes @getpaseo/cli
      - run: |
          echo "NVIDIA_API_KEY=$NVIDIA_API_KEY" >> ~/.reasonix/.env
          echo "OPENCODE_API_KEY=public" >> ~/.reasonix/.env
          npx skills@latest add mattpocock/skills --agent reasonix  --global --yes
          npx skills@latest add Fission-AI/OpenSpec --agent reasonix  --global --yes
          npx skills@latest add addyosmani/agent-skills --agent reasonix --global --yes
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          npm install --global --yes open-websearch
          pushd .github/reasonix_provider_sync
          pip install .
          reasonix-provider-sync --only nvidia
          popd
          paseo onboard --voice disable
          # timeout 15s python3 -c 'import os,pty,subprocess,time; m,s=pty.openpty(); p=subprocess.Popen(["paseo","onboard","--voice","disable"], stdin=s, stdout=s, stderr=s, start_new_session=True); os.close(s); time.sleep(2); os.close(m)' >/dev/null 2>&1 </dev/null
          tail --follow "$HOME/.paseo/daemon.log"
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - if: always()
        run: paseo daemon stop
      - if: always()
        uses: actions/cache/save@main
        with:
          path: |
            ~/.paseo
            ~/.reasonix/sessions
          key: paseo-state-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
