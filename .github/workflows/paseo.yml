name: paseo
concurrency:
  group: paseo-${{ github.actor }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-26
          - macos-26-intel
jobs:
  paseo:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: "0"
          token: ${{ secrets.TOKEN }}
      - uses: ./.github/actions/install-nix
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/nixpkgs
          fetch-depth: "5"
          path: repositories/nixpkgs
          token: ${{ secrets.TOKEN }}
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/torvox
          fetch-depth: "0"
          path: repositories/torvox
          token: ${{ secrets.TOKEN }}
      - uses: cachix/cachix-action@master
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache/restore@main
        id: cache
        with:
          path: |
            ~/.paseo
            ~/.reasonix
          key: paseo-state-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            paseo-state-${{ runner.os }}-${{ runner.arch }}-
      - run: |
          rm --force "$HOME/.config/nix/nix.conf"
          mkdir --parents "$HOME/.paseo" "$HOME/.reasonix/skills" "$HOME/.reasonix/commands"
          npm install --global --yes reasonix
          cp .github/paseo-config.json ~/.paseo/config.json
          nix build --verbose --print-build-logs --print-out-paths --impure .#reasonix-config --out-link /tmp/reasonix-config && install -D --mode 0644 /tmp/reasonix-config ~/.reasonix/config.toml && rm --force /tmp/reasonix-config
          npm install --global --yes @getpaseo/cli
      - run: |
          npx skills@latest add mattpocock/skills --agent reasonix  --global --yes
          npx skills@latest add Fission-AI/OpenSpec --agent reasonix --global --yes
          npx skills@latest add addyosmani/agent-skills --agent reasonix --global --yes
          git clone --depth 1 --single-branch https://github.com/uditgoenka/autoresearch.git /tmp/autoresearch && cp --recursive /tmp/autoresearch/.opencode/skills/autoresearch ~/.reasonix/skills/ && cp --recursive /tmp/autoresearch/.opencode/commands/autoresearch*.md ~/.reasonix/commands/ && rm --recursive --force /tmp/autoresearch
          git clone --depth 1 --single-branch https://github.com/aldefy/compose-skill.git /tmp/compose-skill && cp --recursive /tmp/compose-skill/skills/compose-expert ~/.reasonix/skills/ && rm --recursive --force /tmp/compose-skill
          git clone --depth 1 --single-branch https://github.com/PabloNAX/ultracode-skill.git /tmp/ultracode-skill && cp --recursive /tmp/ultracode-skill/ultracode ~/.reasonix/skills/ && rm --recursive --force /tmp/ultracode-skill
          mkdir --parents "${HOME}/.reasonix/skills/ultra-goal" && curl --location "https://raw.githubusercontent.com/Azure99/ultra-goal/main/skills/ultra-goal/SKILL.md" --output "${HOME}/.reasonix/skills/ultra-goal/SKILL.md"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          npm install --global --yes open-websearch
          npx skills@latest add https://github.com/Aas-ee/open-webSearch --skill open-websearch --agent reasonix --global --yes
          echo "NVIDIA_API_KEY=$NVIDIA_API_KEY" >> ~/.reasonix/.env
          echo "OPENCODE_API_KEY=public" >> ~/.reasonix/.env
          pushd .github/reasonix-config
          pip install -e .
          reasonix-config
          popd
          paseo onboard --voice disable
          # timeout 15s python3 -c 'import os,pty,subprocess,time; m,s=pty.openpty(); p=subprocess.Popen(["paseo","onboard","--voice","disable"], stdin=s, stdout=s, stderr=s, start_new_session=True); os.close(s); time.sleep(2); os.close(m)' >/dev/null 2>&1 </dev/null
          tail --follow "$HOME/.paseo/daemon.log"
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - if: always()
        run: |
          paseo daemon stop
          rm --recursive --force ~/.reasonix/logs ~/.reasonix/config.toml ~/.reasonix/config.toml.bak ~/.reasonix/skills ~/.reasonix/commands ~/.paseo/paseo.pid ~/.paseo/daemon.log
      - if: always()
        uses: actions/cache/save@main
        with:
          path: |
            ~/.paseo
            ~/.reasonix
          key: paseo-state-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
