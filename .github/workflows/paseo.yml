name: paseo
concurrency:
  group: ${{ github.workflow }}-${{ inputs.runner }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
jobs:
  paseo:
    timeout-minutes: 319
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: "0"
          token: ${{ secrets.GH_PAT }}
      - uses: ./.github/actions/install-nix
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/nixpkgs
          fetch-depth: "2"
          path: repositories/nixpkgs
          token: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@main
        with:
          repository: ${{ github.actor }}/torvox
          fetch-depth: "0"
          path: repositories/torvox
          token: ${{ secrets.GH_PAT }}
      - uses: cachix/cachix-action@master
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: ${{ secrets.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: actions/cache/restore@main
        id: cache
        with:
          path: |
            ~/.paseo
            ~/.pi/agent/sessions
            ~/.local/share/cortexkit/magic-context
            ~/.reasonix
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-
      - run: |
          set -euo pipefail
          rm -f "$HOME/.config/nix/nix.conf"
          mkdir -p "$HOME/.paseo" "$HOME/.pi/agent/skills" "$HOME/.pi/agent/extensions" "$HOME/.pi/agent/sessions" "$HOME/.config/cortexkit" "$HOME/.local/share/cortexkit/magic-context" "$HOME/.reasonix" "$HOME/.config/mcp"
          install -m 0644 .github/paseo-config.json ~/.paseo/config.json
          install -m 0644 .github/AGENTS.md ~/.reasonix/AGENTS.md
          nix profile add nixpkgs#openspec nixpkgs#rust-analyzer nixpkgs#ktlint nixpkgs#nixd nixpkgs#ruff nixpkgs#bun .#reasonix
          nix build --verbose --print-build-logs --print-out-paths --impure .#reasonix-config --out-link /tmp/reasonix-config && install -m 0644 /tmp/reasonix-config ~/.reasonix/config.toml && rm -f /tmp/reasonix-config
          cp .github/magic-context.jsonc ~/.config/cortexkit/magic-context.jsonc
          nix build --verbose --print-build-logs --print-out-paths --impure .#pi-agent-settings --out-link /tmp/pi-agent-settings && install -m 0644 /tmp/pi-agent-settings ~/.pi/agent/settings.json && rm -f /tmp/pi-agent-settings
          nix build --verbose --print-build-logs --print-out-paths --impure .#pi-agent-mcp --out-link /tmp/pi-agent-mcp && install -m 0644 /tmp/pi-agent-mcp ~/.config/mcp/mcp.json && rm -f /tmp/pi-agent-mcp
          cp --recursive .github/pi-opencode ~/.pi/agent/extensions/pi-opencode
          pushd ~/.pi/agent/extensions/pi-opencode && npm install --yes && popd
          npm install --global --yes @getpaseo/cli
          install -m 0644 .github/AGENTS.md ~/.pi/agent/AGENTS.md
          npm install --global --yes open-websearch
          bun add -g --ignore-scripts @earendil-works/pi-coding-agent
      - run: |
          cat << 'EOF' > ~/.pi/agent/auth.json
          {
            "opencode": {
              "type": "api_key",
              "key": "public"
            },
            "nvidia": {
              "type": "api_key",
              "key": "${{ secrets.NVIDIA_API_KEY }}"
            }
          }
          EOF
      - run: |
          echo "NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}" > ~/.reasonix/.env
          echo "OPENCODE_API_KEY=public" >> ~/.reasonix/.env
      - run: echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
      - env:
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"
        run: |
          set -euo pipefail
          npx skills@latest add mattpocock/skills --agent pi  --global --yes
          npx skills@latest add addyosmani/agent-skills --agent pi --global --yes
          npx skills@latest add Fission-AI/OpenSpec --agent pi --global --yes
          npx skills@latest add blader/humanizer --agent pi --global --yes
          git clone --depth 1 --single-branch https://github.com/aldefy/compose-skill.git /tmp/compose-skill && cp -r /tmp/compose-skill/skills/compose-expert $HOME/.pi/agent/skills/ && rm -rf /tmp/compose-skill
          npx skills@latest add https://github.com/Aas-ee/open-webSearch --skill open-websearch --agent pi --global --yes
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:${ANDROID_HOME:+$ANDROID_HOME/platform-tools:}$PATH"
          pushd .github/reasonix-config
          pip install -e .
          reasonix-config
          popd
          pi --help
          paseo onboard --relay --voice disable
          # paseo onboard --relay --voice disable > /dev/null
          tail -f "$HOME/.paseo/daemon.log"
      - if: always()
        run: |
          paseo daemon stop
          rm -rf ~/.reasonix/logs ~/.reasonix/config.toml* ~/.reasonix/.env ~/.reasonix/skills ~/.reasonix/commands ~/.paseo/paseo.pid ~/.paseo/daemon.log ~/.reasonix/ ~/.pi/agent/AGENTS.md ~/.pi/agent/models-store.json ~/.pi/agent/settings.json ~/.pi/agent/auth.json ~/.pi/agent/npm ~/.pi/agent/skills ~/.pi/agent/extensions
      - if: always()
        uses: actions/cache/save@main
        with:
          path: |
            ~/.paseo
            ~/.pi/agent/sessions
            ~/.local/share/cortexkit/magic-context
            ~/.reasonix
          key: ${{ github.workflow }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
